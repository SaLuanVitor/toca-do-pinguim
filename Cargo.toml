[workspace]
resolver = "2"
members = ["crates/protocolo", "crates/agente", "src-tauri"]

# A versão é copiada do package.json por scripts/sincronizar-versao.mjs; não edite à mão.
[workspace.package]
version = "0.6.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
