# cargo-deny: confere as dependências em Rust do app e do agente.
#   cargo deny check
# O CI roda o mesmo comando (workflow Segurança).

[graph]
# O app vira binário Windows e o agente, Linux: o CI confere cada um no seu alvo (ver o
# workflow Segurança), para não acusar dependência que só existiria num build que não sai.
targets = ["x86_64-pc-windows-msvc"]
all-features = true

# Vulnerabilidades e pacotes abandonados, pela base RustSec.
[advisories]
yanked = "deny"
ignore = []

# As mesmas licenças aceitas no about.toml, que gera o THIRD-PARTY-NOTICES.md.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# O agente usa poucas licenças da lista; a lista vale para o app e o agente juntos.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

# Só o registro oficial: dependência vinda de repositório git ou de outro registro é
# recusada, porque escapa da auditoria do crates.io.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
