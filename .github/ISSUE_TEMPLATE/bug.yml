name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu
      description: O que você fez, o que esperava e o que viu.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abrir a aba ...
        2. Clicar em ...
  - type: input
    id: versao
    attributes:
      label: Versão do app
      description: Em Configurações > Este app.
      placeholder: 0.5.1
    validations:
      required: true
  - type: dropdown
    id: forma
    attributes:
      label: Como o app foi instalado
      options:
        - Instalador
        - Versão portátil (.zip)
        - Compilado do código
    validations:
      required: true
  - type: textarea
    id: wsl
    attributes:
      label: Saída de wsl --version
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Trecho do log
      description: Página Log, botão Copiar. Confira se não há nada que você não queira tornar público, como nomes de projeto em linhas de comando.
      render: text
