name: Verificar

# Testes e build a cada push nas branches principais e em todo PR. As Actions são fixadas
# por commit, com a versão em comentário: uma tag pode ser movida pelo autor, um commit não.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Os testes do agente leem formatos do /proc e só compilam em Linux.
  agente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p agente -p protocolo

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # O build do app embute o binário do agente, então ele precisa existir antes dos testes.
      - run: npm run agente
      - run: cargo test -p toca-do-pinguim
