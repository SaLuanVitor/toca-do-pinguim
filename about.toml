# cargo-about: licenças das dependências em Rust do app e do agente, para o arquivo
# THIRD-PARTY-NOTICES.md que vai na release. Licença fora desta lista faz a geração falhar,
# e aí é preciso conferir se ela permite distribuir o binário antes de acrescentá-la.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
