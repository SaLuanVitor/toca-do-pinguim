[package]
name = "toca-do-pinguim"
version.workspace = true
license.workspace = true
description = "Gerenciador de tarefas do WSL"
edition = "2024"

[lib]
# O sufixo `_lib` evita colisão de nome entre a lib e o binário no Windows
# (rust-lang/cargo#8519).
name = "toca_do_pinguim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
protocolo = { path = "../crates/protocolo" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }
