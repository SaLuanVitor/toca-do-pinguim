[package]
name = "toca-do-pinguim"
version.workspace = true
license.workspace = true
publish = false
description = "Gerenciador de tarefas do WSL"
edition = "2024"

[lib]
# O sufixo `_lib` evita colisão de nome entre a lib e o binário no Windows
# (rust-lang/cargo#8519).
name = "toca_do_pinguim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
protocolo = { path = "../crates/protocolo" }
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { version = "0.61", features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
] }
tauri-plugin-log = "2.10.1"
log = "0.4.34"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-notification = "2.7.0"
